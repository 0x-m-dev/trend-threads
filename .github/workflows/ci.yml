name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project manifest
        run: python3 - <<'PY'
          import yaml
          with open("PROJECT.yaml") as f: yaml.safe_load(f)
          print("PROJECT.yaml valid")
        PY
      - name: Run project checks
        run: make fmt lint test build
