services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trend-threads
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trend-threads"]
      interval: 5s
      timeout: 5s
      retries: 10
